context:
  version: "26.3.0dev"

package:
  name: freecad
  version: "${{ version }}"

source:
  path: ../..
  use_gitignore: true

build:
  number: 0
  script:
    # The build runs inside a pixi/rattler-build sandbox that does not inherit the
    # host environment, so forward the deployment target through explicitly.
    # Without this, build.sh falls back to its default and the macOS 15 package
    # builds the legacy QuickLook generator instead of the modern .appex.
    env:
      MACOS_DEPLOYMENT_TARGET: ${{ env.get("MACOS_DEPLOYMENT_TARGET", default="11.0") }}

requirements:
  build:
    - ccache
    - cmake
    - compilers>=1.10,<1.11
    - doxygen
    - gtest
    - ninja
    - noqt5
    - python>=3.13,<3.14
    - qt6-main>=6.11,<6.12
    - swig

    - if: linux and x86_64
      then:
        - clang
        - clangxx
        - kernel-headers_linux-64
        - libdrm-cos7-x86_64
        - libselinux-cos7-x86_64
        - libsepol-cos7-x86_64
        - libspnav
        - libx11-common-cos7-x86_64
        - libx11-cos7-x86_64
        - libxau-cos7-x86_64
        - libxcb-cos7-x86_64
        - libxdamage-cos7-x86_64
        - libxext-cos7-x86_64
        - libxfixes-cos7-x86_64
        - libxi-cos7-x86_64
        - libxi-devel-cos7-x86_64
        - libxxf86vm-cos7-x86_64
        - mesa-dri-drivers-cos7-x86_64
        - mesa-libegl-cos7-x86_64
        - mesa-libegl-devel-cos7-x86_64
        - mesa-libgl-cos7-x86_64
        - mesa-libgl-devel-cos7-x86_64
        - mold
        - pixman-cos7-x86_64
        - sed
        - sysroot_linux-64
        - xorg-x11-server-common-cos7-x86_64
        - xorg-x11-server-xvfb-cos7-x86_64
        - xorg-xproto

    - if: linux and aarch64
      then:
        - clang
        - clangxx
        - kernel-headers_linux-aarch64
        - libdrm-cos7-aarch64
        - libselinux-cos7-aarch64
        - libsepol-cos7-aarch64
        - libspnav
        - libx11-common-cos7-aarch64
        - libx11-cos7-aarch64
        - libxau-cos7-aarch64
        - libxcb-cos7-aarch64
        - libxdamage-cos7-aarch64
        - libxext-cos7-aarch64
        - libxfixes-cos7-aarch64
        - libxi-cos7-aarch64
        - libxi-devel-cos7-aarch64
        - libxxf86vm-cos7-aarch64
        - mesa-dri-drivers-cos7-aarch64
        - mesa-libegl-cos7-aarch64
        - mesa-libegl-devel-cos7-aarch64
        - mesa-libgl-cos7-aarch64
        - mesa-libgl-devel-cos7-aarch64
        - mold
        - pixman-cos7-aarch64
        - sed
        - sysroot_linux-aarch64
        - xorg-x11-server-common-cos7-aarch64
        - xorg-x11-server-xvfb-cos7-aarch64
        - xorg-xproto

    - if: osx and x86_64
      then:
        - __osx >=10.13

    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}

  host:
    - eigen
    - fmt
    - freetype
    - hdf5
    - lark
    - libboost-devel
    - matplotlib-base
    - noqt5
    - numpy
    - occt>=7.9,<8.0
    - pcl
    - ply
    - pybind11
    - pyside6
    - python>=3.13,<3.14
    - qt6-main>=6.11,<6.12
    - six
    - smesh
    - vtk
    - xerces-c
    - yaml-cpp
    - zlib

    - if: win
      then:
        - libwinpthread

    - if: unix
      then:
        - sed

    - if: linux
      then:
        - libspnav
        - xorg-xproto

  run:
    - av
    - blas * openblas*
    - blinker
    - calculix
    - debugpy
    - defusedxml
    - docutils
    - gmsh
    - graphviz
    - ifcopenshell
    - lark
    - lxml
    - matplotlib-base
    - nine
    - noqt5
    - numpy
    - occt>=7.9,<8.0
    - olefile
    - opencamlib
    - pandas
    - pip
    - ply
    - pycollada
    - pyside6
    - python>=3.13,<3.14
    - pythonocc-core
    - pyyaml
    - qt6-main>=6.11,<6.12
    - requests
    - scipy
    - sympy
    - typing_extensions
    - vtk
    - xlutils

    - if: linux
      then:
        - libspnav
        - qt6-wayland
